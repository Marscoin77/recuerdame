name = "recuerdame"
main = "worker/index.js"
compatibility_date = "2024-11-06"
workers_dev = true

# Sirve la PWA (carpeta public) como archivos estáticos.
# El Worker (worker/index.js) solo se ejecuta para rutas /api/* que no
# coinciden con ningún archivo estático.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Sincronización multi-dispositivo con Workers KV:
#  - "space:<CODE>"     → metadatos de los recordatorios (JSON)
#  - "<CODE>/<audioId>" → audios grabados (hasta 25 MB por valor)
# Se usa KV (no D1) porque el límite diario de escrituras de D1 es de toda
# la cuenta y puede agotarse por otros proyectos.
[[kv_namespaces]]
binding = "AUDIO_KV"
id = "404f973e927d4734ab85ce7722217b27"

# Cron: cada minuto revisa los recordatorios y envía avisos push aunque la
# app esté cerrada (ver scheduled() en worker/index.js).
[triggers]
crons = ["* * * * *"]

# Variables públicas (NO secretas). La clave privada VAPID se guarda como
# secreto con:  wrangler secret put VAPID_PRIVATE_JWK
[vars]
VAPID_PUBLIC = "BPA_pYlaFfg9RoisjdbqHl9I3z99dGDfszaEDgaoql5pOT9pWNiI2i_cdPYBsa3y8vgIHhERk-T9joSgv_TZUtg"
